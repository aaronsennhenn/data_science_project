<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-script {
            font-family: 'Dancing Script', cursive;
        }
        .bg-soft-beige {
            background-color: #D2BD96;
        }
    </style>
</head>
<body class="bg-soft-beige min-h-screen flex flex-col">
    <header class="w-full bg-white shadow-md py-4 px-8">
        <nav class="flex justify-between items-center">
            <div class="text-xl font-bold text-gray-800">Savor.</div>
            <div class="space-x-4">
                <a href="/" class="px-4 py-2 bg-gray-900 text-white rounded">Home</a>
                <a href="/about" class="px-4 py-2 bg-gray-900 text-white rounded">About</a>
                <a href="/review" class="px-4 py-2 bg-gray-900 text-white rounded">Review</a>
                <a href="/contact" class="px-4 py-2 bg-gray-900 text-white rounded">Contact</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center px-4">
        <div class="max-w-6xl w-full flex">
            <div class="w-1/2 pr-8">
                <h1 class="text-5xl font-semibold text-gray-800 mb-8 font-script">Contact Us</h1>
                <form action="https://formsubmit.co/laura.k0906@googlemail.com" method="POST" class="space-y-4">
                    <div>
                        <label for="name" class="block text-gray-700 mb-2">Name</label>
                        <input type="text" id="name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="email" class="block text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="message" class="block text-gray-700 mb-2">Message</label>
                        <textarea id="message" name="message" required rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <button type="submit" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Send Message</button>
                </form>
            </div>
            <div class="w-1/2">
                <img src="{{ url_for('static', filename='images/coffeeshop.jpg') }}" alt="coffeeshop" class="w-full h-full object-cover rounded-lg">
            </div>
        </div>
    </main>
</body>
</html>
