<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensa Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-script { font-family: 'Dancing Script', cursive; }
        .bg-custom-beige { background-color: #D2BD96; }
        .loading-button {
            display: inline-block;
            width: 100px;
            height: 100px;
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-custom-beige min-h-screen flex flex-col">
    <!-- Header -->
    <header class="w-full bg-white shadow-md py-4 px-8">
        <nav class="flex justify-between items-center">
            <div class="text-xl font-bold text-gray-800">Savor.</div>
            <div class="space-x-4">
                <a href="/" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Home</a>
                <a href="/about" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">About</a>
                <a href="/review" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Review</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-8">
        <h1 class="font-script text-3xl font-semibold text-gray-900 mb-4">Mensa Menu for {{ selected_date }}</h1>
        <div class="mb-8"></div> <!-- Added space -->
        <div class="w-full max-w-4xl">
            {% for dish in all_dishes %}
                <div class="mb-6 p-4 bg-white shadow-md rounded-md flex items-center">
                    <div class="w-1/4 flex justify-center items-center">
                        <div class="loading-button" id="loading-{{ loop.index }}"></div>
                        <img data-src="{{ url_for('static', filename='generated_images/' ~ dish.image_filename) }}" alt="{{ dish.menu }}" class="hidden w-full h-full object-cover" id="image-{{ loop.index }}">
                    </div>
                    <div class="w-3/4 pl-4">
                        <h2 class="text-xl font-semibold">{{ dish.menuLine }}</h2>
                        <p class="text-gray-600">{{ dish.menu }}</p>
                        <p class="text-gray-800 font-bold">{{ dish.studentPrice }} €</p>
                    </div>
                </div>
            {% endfor %}
        </div>
        <div class="mb-8"></div> <!-- Added space -->
        <p class="text-gray-600 mb-6">
            <table class="table-auto"> 
                <tr>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_fisch.png') }}" alt="fisch" class="inline-block w-6 h-6 mr-2">[f] Fisch</td>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_gefluegel.png') }}" alt="geflügel" class="inline-block w-6 h-6 mr-2">[g] Geflügel</td>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_kalb.png') }}" alt="kalb" class="inline-block w-6 h-6 mr-2">[k] Kalb</td>
                </tr>
                <tr>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_lamm.png') }}" alt="lamm" class="inline-block w-6 h-6 mr-2">[l] Lamm</td>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_rind.png') }}" alt="rind" class="inline-block w-6 h-6 mr-2">[r] Rind</td>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_schwein.png') }}" alt="schwein" class="inline-block w-6 h-6 mr-2">[s] Schwein</td>
                </tr>
                <tr>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_wild.png') }}" alt="wild" class="inline-block w-6 h-6 mr-2">[w] Wild</td>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_empfehlung.png') }}" alt="top" class="inline-block w-6 h-6 mr-2">[top] Empfehlung</td>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_vegetarisch.png') }}" alt="vegetarisch" class="inline-block w-6 h-6 mr-2">[v] Vegetarisch</td>
                </tr>
                <tr>
                    <td class="pr-8"><img src="{{ url_for('static', filename='images/icon_vegan.png') }}" alt="vegan" class="inline-block w-6 h-6 mr-2">[vegan] Vegan</td>
                </tr>
            </table>
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('img[id^="image-"]');
            const checkImageExists = (url) => {
                return fetch(url, { method: 'HEAD' })
                    .then(response => response.ok)
                    .catch(() => false);
            };

            const loadImage = async (img) => {
                const src = img.getAttribute('data-src');
                const loadingId = 'loading-' + img.id.split('-')[1];
                while (!(await checkImageExists(src))) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                img.src = src;
                img.onload = function() {
                    document.getElementById(loadingId).style.display = 'none';
                    img.style.display = 'block';
                };
            };

            images.forEach(img => {
                loadImage(img);
            });
        });
    </script>
</body>
</html>
