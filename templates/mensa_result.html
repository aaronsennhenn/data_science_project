<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ selected_option }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-script { font-family: 'Dancing Script', cursive; }
        .font-roboto { font-family: 'Roboto', sans-serif; }
        .round-image-container {
            width: 160px;
            height: 160px;
            overflow: hidden;
            border-radius: 50%;
        }
        .round-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bg-soft-beige { background-color: #D2BD96; }
    </style>
</head>
<body class="bg-soft-beige min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <header class="w-full bg-white shadow-md py-4 px-8">
        <nav class="flex justify-between items-center">
            <div class="text-xl font-bold text-gray-800">Savor.</div>
            <div class="space-x-4">
                <a href="/" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Home</a>
                <a href="/about" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">About</a>
                <a href="/review" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Review</a>
            </div>
        </nav>
    </header>

     <!-- Main Content -->
     <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-4">{{ selected_option }}</h1>
        <p class="text-xl mb-6">Menu for {{ selected_date }}</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8">
            {% for dish in all_dishes %}
            <div class="flex flex-col items-center">
                <div class="round-image-container mb-4">
                    <img src="{{ url_for('static', filename='generated_images/' + dish['image_filename']) }}" alt="{{ dish['menu'] }}" class="round-image">
               </div>
                <p class="text-center font-roboto font-bold text-gray-700 mb-2">{{ dish["menuLine"] }}</p>
                <p class="text-center font-roboto text-gray-600 mb-2">
                    {{ dish["menu"] }}
                </p>
                <p class="text-center font-roboto font-bold text-gray-800">
                    {{ dish["studentPrice"] }} &euro;
                </p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
