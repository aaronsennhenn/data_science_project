<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-3xl font-semibold text-gray-800 mb-4">Choose your Favourite Menu</h1>
        <p class="text-gray-600 mb-6">
            Discover the diverse culinary offerings across Tübingen's cafeterias and mensas. From hearty traditional dishes to creative vegan options, there's something to satisfy every palate.
        <p>
    </div>
    <img src="{{ url_for('static', filename='images/welcome.jpeg') }}" alt="Thumbnail" class="mt-4 w-24 h-24">
    <script>
        let count = 0;
        document.getElementById('incrementButton').addEventListener('click', () => {
            count++;
            document.getElementById('counter').innerText = count;
        });
    </script>
</body>
</html>
