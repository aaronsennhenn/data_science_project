<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dining Facilities</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dining_facilities.css') }}" rel="stylesheet"> <!-- Custom CSS -->

</head>

<body class="bg-custom-beige min-h-screen flex flex-col">
    <!-- Header -->
    <header class="w-full bg-white shadow-md py-4 px-8">
        <nav class="flex justify-between items-center">
            <div class="text-xl font-bold text-gray-800">Savor.</div>
            <div class="space-x-4">
                <a href="/" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Home</a>
                <a href="/about" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">About</a>
                <a href="/review" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Review</a>
                <a href="/contact" class="px-4 py-2 bg-gray-900 text-white rounded">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex">
        <div class="flex w-full">
            <!-- Left side with image -->
            <div class="w-1/2">
                <img src="{{ url_for('static', filename='images/background.jpg') }}" alt="Dining Facility" class="w-full h-full object-cover">
            </div>
            
            <!-- Right side with content -->
            <div class="w-1/2 flex items-center justify-center p-8">
                <div class="text-center">
                    <h1 style="font-size: 52px;" class="font-script text-3xl font-semibold text-gray-900 mb-4">Dining Facilities</h1>
                    <p class="text-gray-600 mb-6">
                        Explore our various dining facilities across Tübingen.
                    </p>                    

                    <!-- Date selector -->
                    <div class="mb-6">
                        <h2 class="text-xl font-semibold mb-2">Select a Date:</h2>
                        <select id="dateSelector">
                            {% for date in available_dates %}
                                <option value="{{ date.split(', ')[1] }}">{{ date }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Mensa selector -->
                    <div class="mb-6">
                        <h2 class="text-xl font-semibold mb-2">Select a Mensa:</h2>
                        <select id="mensaSelector">
                            {% for mensa in available_mensas %}
                                <option value="{{ mensa }}">{{ mensa }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Submit button -->
                    <button id="submitButton" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-900 transition duration-300">View Menu</button>
                </div>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/dining_facilities.js') }}"></script> <!-- Custom JS -->
</body>
</html>
