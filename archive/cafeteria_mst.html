<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Morgenstelle</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-script { font-family: 'Dancing Script', cursive; }
        .font-roboto { font-family: 'Roboto', sans-serif; }
        .round-image-container {
            width: 160px;
            height: 160px;
            overflow: hidden;
            border-radius: 50%;
        }
        .round-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bg-soft-beige { background-color: #D2BD96; }
    </style>
</head>
<body class="bg-soft-beige min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <header class="w-full bg-white shadow-md py-4 px-8">
        <nav class="flex justify-between items-center">
            <div class="text-xl font-bold text-gray-800">Savor.</div>
            <div class="space-x-4">
                <a href="/" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Home</a>
                <a href="/about" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">About</a>
                <a href="/review" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Review</a>
                <a href="/contact" class="px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 transition duration-300">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center">
        <div class="container mx-auto px-4 py-8">
            <h1 class="font-script text-5xl text-center text-gray-900 mb-12">Cafeteria Morgenstelle</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8">
                <div class="flex flex-col items-center">
                    <div class="round-image-container mb-4">
                        <img src="{{ url_for('static', filename='images/menu_1.png') }}" alt="Menu 1" class="round-image">
                    </div>
                    <p class="text-center font-roboto font-bold text-gray-700 mb-2">Menu 1</p>
                    <p class="text-center font-roboto text-gray-600 mb-2">
                        Chicken salad with fries.
                    </p>
                    <p class="text-center font-roboto font-bold text-gray-800">
                        5,30 EUR
                    </p>
                </div>
                <div class="flex flex-col items-center">
                    <div class="round-image-container mb-4">
                        <img src="{{ url_for('static', filename='images/menu_2.png') }}" alt="Menu 2" class="round-image">
                    </div>
                    <p class="text-center font-roboto font-bold text-gray-700 mb-2">Menu 2</p>
                    <p class="text-center font-roboto text-gray-600 mb-2">
                        Sausages with mashed potatoes.
                    </p>
                    <p class="text-center font-roboto font-bold text-gray-800">
                        2,90 EUR
                    </p>
                </div>
                <div class="flex flex-col items-center">
                    <div class="round-image-container mb-4">
                        <img src="{{ url_for('static', filename='images/menu_1.png') }}" alt="Menu 3" class="round-image">
                    </div>
                    <p class="text-center font-roboto font-bold text-gray-700 mb-2">Menu 3</p>
                    <p class="text-center font-roboto text-gray-600 mb-2">
                        Chicken salad with fries.
                    </p>
                    <p class="text-center font-roboto font-bold text-gray-800">
                        5,30 EUR
                    </p>
                </div>
                <div class="flex flex-col items-center">
                    <div class="round-image-container mb-4">
                        <img src="{{ url_for('static', filename='images/menu_2.png') }}" alt="Menu 4" class="round-image">
                    </div>
                    <p class="text-center font-roboto font-bold text-gray-700 mb-2">Menu 4</p>
                    <p class="text-center font-roboto text-gray-600 mb-2">
                        Sausages with mashed potatoes.
                    </p>
                    <p class="text-center font-roboto font-bold text-gray-800">
                        2,90 EUR
                    </p>
                </div>
                <div class="flex flex-col items-center">
                    <div class="round-image-container mb-4">
                        <img src="{{ url_for('static', filename='images/cafeteria_1.jpg') }}" alt="Menu 5" class="round-image">
                    </div>
                    <p class="text-center font-roboto font-bold text-gray-700 mb-2">Menu 5</p>
                    <p class="text-center font-roboto text-gray-600 mb-2">
                        Coffee.
                    </p>
                    <p class="text-center font-roboto font-bold text-gray-800">
                        1,20 EUR
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
